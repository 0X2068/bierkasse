}

/* ---- Höher oder Tiefer ---- */
function hlState(){
  if(!S.hl) S.hl = { card:null, prev:null, pile:1, turn:0, last:null };
  if(!S.hl.card) S.hl.card = freshCard();
  if(S.hl.turn >= S.players.length) S.hl.turn = 0;
  return S.hl;
}
function hlGuess(g){
  const H = hlState();
  if(distPending()) return;
  const i = H.turn, p = S.players[i];
  if((g === 'hi' && H.card.r === 'A') || (g === 'lo' && H.card.r === '2')) return;
  for(const q of S.players) q.recv = [];
  const old = H.card, c = freshCard();
  const a = rk(old), b = rk(c);
  const ok = g === 'hi' ? b > a : g === 'lo' ? b < a : b === a;
  const entries = [];
  H.last = { i, g, ok, pile:H.pile };
  if(ok && g === 'eq'){
    const w = Math.min(RL_MAX, H.pile * 2);
    entries.push({ i, lose:0, win:w }); H.last.win = w; H.pile = 1;
    toast('Volltreffer!', 'good', p.name + ' gewinnt ' + sipTxt(w)); buzz([30, 40, 30]);
  } else if(ok){
    H.pile++;
    toast('Richtig!', 'good', 'Stapel: ' + H.pile + ' Karten', 800);
  } else {
    const n = Math.min(6, H.pile);
    entries.push({ i, lose:n, win:0 }); H.last.lose = n; H.pile = 1;
    toast('Falsch!', 'bad', p.name + ': ' + sipTxt(n)); buzz(120);
  }
  H.prev = old; H.card = c; H.turn = (i + 1) % S.players.length;
  applySips(entries);
  save(); render();
}
function viewHilo(){
  const H = hlState();
  const L = H.last;
  let h = '<div class="stage">' + (H.prev ? '<div class="cards prev">' + cardHTML(H.prev, false) + '</div>' : '') +
    '<div class="cards big">' + cardHTML(H.card, false) + '</div></div>' +
    '<div class="pile"><span class="vbadge">Stapel ' + H.pile + '</span><span class="sub">Falsch kostet ' + sipTxt(Math.min(6, H.pile)) + '</span></div>';
  if(L){
    const gname = { hi:'Höher', lo:'Tiefer', eq:'Gleich' }[L.g];
    h += '<div class="note center">' + esc(S.players[L.i] ? S.players[L.i].name : '') + ' sagte ' + gname + ': ' + (L.ok ? 'richtig' : 'falsch') + '</div>';
  }
  h += stripSeats(distPending() ? -1 : H.turn);
  let bar;
  if(S.give) bar = givePanel();
  else if(distPending()) bar = distPanel();
  else {
    const p = S.players[H.turn];
    bar = '<div class="who"><span><b>' + esc(p.name) + '</b> ist dran</span><span>Karte: <b>' + H.card.r + '</b></span></div>' +
      '<div class="acts n3"><button class="act hit" data-act="hl" data-v="hi"' + (H.card.r === 'A' ? ' disabled' : '') + '>Höher</button><button class="act" data-act="hl" data-v="eq">Gleich</button><button class="act hit" data-act="hl" data-v="lo"' + (H.card.r === '2' ? ' disabled' : '') + '>Tiefer</button></div>';
  }
  return { h, bar };
}

/* ---- Busfahrer ---- */
const BUS_Q = [
  { q:'Rot oder Schwarz?', o:[['rot','Rot'],['schwarz','Schwarz']] },
  { q:'Höher oder tiefer als die erste Karte?', o:[['hi','Höher'],['lo','Tiefer']] },
  { q:'Zwischen, daneben oder trifft?', o:[['in','Zwischen'],['out','Daneben'],['eq','Trifft']] },
  { q:'Welches Symbol?', o:[['♠','♠'],['♥','♥'],['♦','♦'],['♣','♣']] }
];
const PYR_ROWS = [4, 3, 2, 1];
const BUS_BEER = 10;
const PYR_GIVE = [false, true, false, true];
const pyrWord = r => PYR_GIVE[r] ? 'verteilen' : 'trinken';
function makeDeck(){
  const d = [];
  for(const [su, red] of SUITS) for(const r of RANKS) d.push({ r, s:su, red, id: ++S.serial });
  for(let i = d.length - 1; i > 0; i--){ const j = rnd(i + 1); [d[i], d[j]] = [d[j], d[i]]; }
  return d;
}
function busJudge(step, v, prev, c){
  if(step === 0) return (v === 'rot') === !!c.red;
  if(step === 1){ const a = rk(prev[0]), b = rk(c); return v === 'hi' ? b > a : b < a; }
  if(step === 2){ const x = rk(prev[0]), y = rk(prev[1]), lo = Math.min(x, y), hi = Math.max(x, y), z = rk(c); return v === 'in' ? (z > lo && z < hi) : v === 'eq' ? (z === lo || z === hi) : (z < lo || z > hi); }
  return c.s === v;
}
function busNew(){
  const decks = S.players.length * 4 + 10 > 52 ? Math.ceil((S.players.length * 4 + 10) / 52) : 1;
  let deck = [];
  for(let k = 0; k < decks; k++) deck = deck.concat(makeDeck());
  for(const q of S.players){ q.gr = null; q.recv = []; }
  S.bus = { v:2, phase:'deal', deck, turn:0, hands:S.players.map(() => []), pyr:[], flip:0, driver:null, ride:null, last:null };
}
function busState(){
  if(!S.bus || S.bus.v !== 2 || (S.bus.phase !== 'end' && S.bus.hands.length !== S.players.length)) busNew();
  return S.bus;
}
function busDeal(v){
  const B = busState();
  if(B.phase !== 'deal' || distPending()) return;
  const i = B.turn, p = S.players[i], hand = B.hands[i], step = hand.length;
  if(busImpossible(step, v, hand)) return;
  const c = B.deck.pop(), ok = busJudge(step, v, hand, c), n = 1;
  hand.push(c);
  for(const q of S.players) q.recv = [];
  applySips([{ i, lose: ok ? 0 : n, win: ok ? n : 0 }]);
  B.last = { i, ok, n };
  toast(ok ? 'Richtig!' : 'Falsch!', ok ? 'good' : 'bad', p.name + (ok ? ': ' + sipTxt(n) + ' gewonnen' : ': ' + sipTxt(n)), 900);
  if(!ok) buzz(100);
  if(hand.length === 4){
    B.turn++;
    if(B.turn >= S.players.length){
      B.phase = 'pyr'; B.pyr = []; B.flip = 0;
      for(let r = 0; r < 4; r++) for(let k = 0; k < PYR_ROWS[r]; k++) B.pyr.push({ c:B.deck.pop(), row:r, open:false });
      toast('Pyramide', 'good', 'Jetzt wird aufgedeckt', 1300);
    }
  }
  save(); render();
}
function busFlip(){
  const B = busState();
  if(B.phase !== 'pyr' || distPending()) return;
  const card = B.pyr[B.flip], val = card.row + 1;
  card.open = true; B.flip++;
  for(const q of S.players){ q.recv = []; q.gr = null; }
  const lays = [], give = PYR_GIVE[card.row];
  B.hands.forEach((hand, i) => {
    const m = hand.filter(c => c.r === card.c.r);
    if(!m.length) return;
    B.hands[i] = hand.filter(c => c.r !== card.c.r);
    lays.push({ i, n:m.length });
  });
  if(give){
    S.dist = []; S.distIdx = 0;
    if(S.players.length > 1) for(const l of lays) S.dist.push({ from:l.i, sips:val * l.n, shots:0, alloc:{}, lay:true });
    if(!S.dist.length) S.dist = null;
  } else {
    applySips(lays.map(l => ({ i:l.i, lose:val * l.n, win:0 })));
    if(lays.length) buzz(100);
  }
  B.last = { card:card.c, val, lays, give };
  toast(lays.length ? lays.map(l => S.players[l.i].name + (l.n > 1 ? ' ' + l.n + '×' : '')).join(', ') + ' legt ab' : 'Keiner hat eine ' + card.c.r,
    lays.length ? (give ? 'good' : 'bad') : '', lays.length ? sipTxt(val) + ' pro Karte ' + pyrWord(card.row) : '', 1300);
  if(B.flip >= B.pyr.length) busPickDriver();
  save(); render();
}
function busPickDriver(){
  const B = S.bus;
  const most = Math.max(...B.hands.map(h => h.length));
  const cand = B.hands.map((h, i) => h.length === most ? i : -1).filter(i => i >= 0);
  if(cand.length === 1){ busStartRide(cand[0], 'Die meisten Karten auf der Hand'); return; }
  B.phase = 'stech';
  B.stech = { cands:cand, idx:0, round:1, res:{}, prev:null };
  toast('Stechen!', 'bad', cand.map(i => S.players[i].name).join(', ') + ' haben gleich viele Karten', 1900);
}
function busStartRide(i, why){
  const B = S.bus;
  B.driver = i; B.phase = 'ride';
  B.ride = { deck:B.deck.splice(0), cards:[], tries:1, sips:0, drunk:0, paid:0, fail:null };
  if(B.ride.deck.length < 4) B.ride.deck = B.ride.deck.concat(makeDeck());
  toast(S.players[i].name + ' fährt Bus!', 'bad', why, 1900);
}
function busStech(v){
  const B = busState();
  if(B.phase !== 'stech' || distPending()) return;
  const St = B.stech, i = St.cands[St.idx];
  if(!B.deck.length) B.deck = makeDeck();
  const c = B.deck.pop(), ok = (v === 'rot') === !!c.red;
  St.res[i] = { c, ok };
  St.idx++;
  toast(ok ? 'Richtig!' : 'Falsch!', ok ? 'good' : 'bad', S.players[i].name + ': ' + (c.red ? 'Rot' : 'Schwarz'), 800);
  if(St.idx < St.cands.length){ save(); render(); return; }
  const wrong = St.cands.filter(j => !St.res[j].ok);
  St.prev = { cands:St.cands.slice(), res:St.res };
  if(wrong.length === 1){ busStartRide(wrong[0], 'Beim Stechen verloren'); save(); render(); return; }
  if(wrong.length > 1 && wrong.length < St.cands.length) St.cands = wrong;
  St.idx = 0; St.res = {}; St.round++;
  toast('Nochmal stechen', '', wrong.length ? St.cands.map(j => S.players[j].name).join(', ') + ' stechen weiter' : 'Alle richtig, nochmal', 1300);
  save(); render();
}
function busRide(v){
  const B = busState();
  if(B.phase !== 'ride' || distPending()) return;
  const Rd = B.ride, i = B.driver, p = S.players[i];
  if(busImpossible(Rd.cards.length, v, Rd.cards)) return;
  const step = Rd.cards.length, c = Rd.deck.pop(), ok = busJudge(step, v, Rd.cards, c);
  Rd.cards.push(c);
  for(const q of S.players) q.recv = [];
  if(!ok){
    const n = 1;
    applySips([{ i, lose:n, win:0 }]);
    Rd.sips += n;
    const gr = S.players[i].gr || { d:n, paid:0 };
    Rd.drunk = (Rd.drunk || 0) + gr.d; Rd.paid = (Rd.paid || 0) + gr.paid;
    Rd.fail = { cards:Rd.cards.slice(), n }; Rd.cards = []; Rd.tries++;
    toast('Falsch!', 'bad', p.name + ': 1 Schluck, zurück auf Anfang'); buzz(120);
  } else if(step === 3){
    busEnd(true);
  } else {
    Rd.fail = null;
    toast('Richtig!', 'good', 'Noch ' + (3 - step) + (3 - step === 1 ? ' Frage' : ' Fragen'), 700);
  }
  if(B.phase === 'ride' && Rd.sips >= BUS_BEER) busEnd(false, 'beer');
  if(B.phase === 'ride' && !Rd.deck.length) busEnd(false, 'deck');
  save(); render();
}
function busEnd(made, why){
  const B = S.bus;
  B.phase = 'end'; B.made = made; B.why = made ? 'made' : (why || 'deck');
  for(const q of S.players) q.gr = null;
  const p = S.players[B.driver];
  toast(made ? 'Raus aus dem Bus!' : B.why === 'beer' ? BUS_BEER + ' Schlücke im Bus!' : 'Deck durch!', 'good', p.name + (made ? ' hat es geschafft' : ' ist erlöst'), 1900);
}
function busCounter(Rd){
  const sips = Rd.sips || 0, beers = sips / 6;
  return '<div class="buscount"><div><b>' + sips + '</b><span>' + (sips === 1 ? 'Schluck' : 'Schlücke') + ' im Bus</span></div>' +
    '<div><b>' + fmt(Math.round(beers * 10) / 10) + '</b><span>Bier</span></div>' +
    '<div><b>' + Rd.tries + '</b><span>' + (Rd.tries === 1 ? 'Versuch' : 'Versuche') + '</span></div></div>' +
    (Rd.paid ? '<div class="sub center">davon ' + sipTxt(Rd.paid) + ' vom Konto bezahlt, ' + sipTxt(Rd.drunk || 0) + ' wirklich getrunken</div>' : '');
}
function handMini(cards){
  return cards.length ? '<div class="cards handmini">' + cards.map(c => cardHTML(c, false)).join('') + '</div>' : '<div class="sub">Keine Karten</div>';
}
function slotsHTML(cards, faded){
  return '<div class="busrow' + (faded ? ' faded' : '') + '">' + [0,1,2,3].map(k => cards[k] ? '<div class="cards">' + cardHTML(cards[k], false) + '</div>' : '<div class="slot">' + (k + 1) + '</div>').join('') + '</div>';
}
function busImpossible(step, v, cards){
  if(step === 1) return (v === 'hi' && cards[0].r === 'A') || (v === 'lo' && cards[0].r === '2');
  if(step === 2 && v === 'in') return Math.abs(rk(cards[0]) - rk(cards[1])) <= 1;
  return false;
}
function answerBar(name, step, act, label, cards){
  const Q = BUS_Q[step];
  return '<div class="who"><span><b>' + esc(name) + '</b> ' + label + '</span><span>Frage ' + (step + 1) + '/4</span></div>' +
    '<div class="acts n' + Q.o.length + '">' + Q.o.map(([v, l]) => '<button class="act' + (v === 'rot' || v === '♥' || v === '♦' ? ' redtxt' : '') + (Q.o.length === 2 ? ' hit' : '') + '" data-act="' + act + '" data-v="' + v + '"' + (cards && busImpossible(step, v, cards) ? ' disabled' : '') + '>' + (l.length === 1 ? l + '\uFE0E' : l) + '</button>').join('') + '</div>';
}
function viewBus(){
  const B = busState();
  let h = '', bar = '';
  const showHands = (p, i) => B.phase === 'end' ? '' : handMini(B.hands[i] || []);
  if(B.phase === 'deal'){
    const p = S.players[B.turn], hand = B.hands[B.turn];
    h += '<div class="phase">Runde 1: Karten verteilen</div>' + slotsHTML(hand) +
      '<div class="question">' + BUS_Q[hand.length].q + '</div><div class="sub center">Richtig bringt einen Schluck, falsch kostet einen Schluck</div>';
    h += stripSeats(B.turn, { lock:true, extra:showHands });
    bar = S.give ? givePanel() : distPending() ? distPanel() : answerBar(p.name, hand.length, 'bus', 'bekommt Karten', hand);
  } else if(B.phase === 'pyr'){
    h += '<div class="phase">Runde 2: Pyramide</div><div class="pyr">';
    for(let r = 3; r >= 0; r--){
      h += '<div class="prow"><span class="plbl' + (PYR_GIVE[r] ? ' give' : '') + '">' + (r + 1) + '<small>' + (PYR_GIVE[r] ? 'verteilen' : 'trinken') + '</small></span>' + B.pyr.map((x, k) => x.row === r ? '<div class="cards' + (k === B.flip ? ' next' : '') + '">' + cardHTML(x.c, !x.open) + '</div>' : '').join('') + '</div>';
    }
    h += '</div>';
    if(B.last && B.last.card) h += '<div class="note center">' + (B.last.lays.length ? B.last.lays.map(l => esc(S.players[l.i].name) + (l.n > 1 ? ' ' + l.n + '×' : '')).join(', ') + ' legt ' + B.last.card.r + ' ab und ' + (B.last.give ? 'verteilt' : 'trinkt') : 'Niemand hat eine ' + B.last.card.r) + '</div>';
    h += stripSeats(-1, { lock:true, extra:showHands });
    if(S.give) bar = givePanel();
    else if(distPending()) bar = distPanel();
    else if(B.flip < B.pyr.length){ const row = B.pyr[B.flip].row + 1; bar = '<div class="who"><span>Wer die Karte hat, legt ab und ' + (PYR_GIVE[row - 1] ? 'verteilt' : 'trinkt') + '</span></div><button class="primary" data-act="busFlip">Aufdecken: Reihe ' + row + ', ' + sipTxt(row) + ' ' + pyrWord(row - 1) + '</button>'; }
  } else if(B.phase === 'stech'){
    const St = B.stech, cur = S.players[St.cands[St.idx]];
    h += '<div class="phase">Stechen, Runde ' + St.round + ': Wer falsch liegt, fährt Bus</div><div class="stech">' +
      St.cands.map(j => { const r = St.res[j]; return '<div class="stc' + (j === St.cands[St.idx] ? ' on' : '') + '"><b>' + esc(S.players[j].name) + '</b>' +
        (r ? '<div class="cards">' + cardHTML(r.c, false) + '</div><span class="res ' + (r.ok ? 'win">richtig' : 'lose">falsch') + '</span>' : '<div class="slot sm">?</div>') + '</div>'; }).join('') + '</div>';
    if(St.prev && St.round > 1) h += '<div class="sub center">Letzte Runde: ' + St.prev.cands.map(j => esc(S.players[j].name) + ' ' + (St.prev.res[j].ok ? 'richtig' : 'falsch')).join(', ') + '</div>';
    h += stripSeats(St.cands[St.idx], { lock:true, noThrow:true, extra:showHands });
    bar = S.give ? givePanel() : distPending() ? distPanel() :
      '<div class="who"><span><b>' + esc(cur.name) + '</b> sticht</span><span>Rot oder Schwarz?</span></div>' +
      '<div class="acts n2"><button class="act hit redtxt" data-act="bus" data-v="rot">Rot</button><button class="act hit" data-act="bus" data-v="schwarz">Schwarz</button></div>';
  } else if(B.phase === 'ride'){
    const Rd = B.ride, p = S.players[B.driver];
    h += '<div class="phase">Runde 3: ' + esc(p.name) + ' fährt Bus</div>';
    h += busCounter(Rd);
    h += Rd.cards.length || !Rd.fail ? slotsHTML(Rd.cards) : slotsHTML(Rd.fail.cards, true);
    h += '<div class="question">' + BUS_Q[Rd.cards.length].q + '</div><div class="sub center">Falsch kostet einen Schluck und es geht von vorne los. Noch ' + sipTxt(BUS_BEER - Rd.sips) + ' bis zur Erlösung, ' + Rd.deck.length + ' Karten im Deck.</div>';
    h += stripSeats(B.driver, { lock:true, noThrow:true, extra:showHands });
    bar = S.give ? givePanel() : distPending() ? distPanel() : answerBar(p.name, Rd.cards.length, 'bus', 'fährt Bus', Rd.cards);
  } else {
    const p = S.players[B.driver] || { name:'?' };
    h += '<div class="phase">Busfahrt beendet</div>' + slotsHTML(B.ride ? (B.made ? B.ride.cards : (B.ride.fail ? B.ride.fail.cards : B.ride.cards)) : []) +
      '<div class="question ok">' + esc(p.name) + (B.made ? ' ist raus!' : B.why === 'beer' ? ' hat ' + BUS_BEER + ' Schlücke im Bus getrunken und ist erlöst.' : ' ist erlöst, das Deck ist durch.') + '</div>' +
      busCounter(B.ride);
    h += stripSeats(-1, {});
    bar = S.give ? givePanel() : '<button class="primary" data-act="busNew">Neue Busfahrt</button>';
  }
  return { h, bar };
}

function viewGame(){
  const g = game();
  const v = g === 'roulette' ? viewRoulette() : g === 'hilo' ? viewHilo() : viewBus();
  let h = '<div class="wrap' + (distPending() ? ' tall' : '') + '">' + topBar() + v.h + '</div>';
  if(v.bar) h += '<div class="bar"><div class="bar-in">' + v.bar + '</div></div>';
  if(ui.menu) h += menuSheet();
  return h;
}
function canSwitch(){
  if(distPending() || S.give) return false;
  const g = game();
  if(g === 'blackjack') return S.phase === 'bet' || S.phase === 'result';
  if(g === 'roulette') return rlState().phase !== 'spin';
  return true;
}
function switchGame(g){
  if(!canSwitch() || !GAMES[g] || isCasino()) return;
  if(game() === 'blackjack' && S.phase === 'result') nextRound();
  if(game() === 'roulette' && S.rl && S.rl.phase === 'result') S.rl.phase = 'bet';
  for(const p of S.players){ p.gr = null; p.recv = []; if(!p.bet) p.bet = 1; }
  S.game = g; S.dist = null;
  ui.menu = false;
  toast(GAMES[g].name, 'good', 'Gleiche Spieler, gleiche Biere', 1200);
  save(); render();
  try{ window.scrollTo(0, 0); }catch(e){}
}
function otherRules(){
  const g = game();
  let r = '<h2>So wird gespielt</h2><ul>';
  if(g === 'roulette') r += '<li>Oben wählen, wer setzt, dann aufs Tableau tippen. Jeder setzt bis zu 6 Schlücke, verteilt auf beliebig viele Felder.</li><li>Rot, Schwarz, Gerade, Ungerade, 1–18, 19–36: Gewinn in Höhe des Einsatzes.</li><li>Dutzende und Kolonnen (2 : 1): doppelter Einsatz. Einzelne Zahl: zwölffacher Einsatz, ein Schluck reicht also für den Höchstgewinn.</li><li>Gewinne und Verluste einer Runde werden verrechnet, höchstens 12 Gewinn.</li><li>Bei der 0 verlieren alle, außer wer genau auf 0 gesetzt hat.</li>';
  if(g === 'hilo') r += '<li>Reihum rät jeder, ob die nächste Karte höher oder tiefer ist. Ass ist hoch. Liegt ein Ass, geht nur Tiefer oder Gleich, liegt eine 2, nur Höher oder Gleich.</li><li>Richtig: Der Stapel wächst um eine Karte.</li><li>Falsch oder gleich: so viele Schlücke, wie Karten im Stapel liegen, höchstens 6. Danach fängt der Stapel neu an.</li><li>Wer „Gleich“ sagt und richtig liegt, gewinnt den doppelten Stapel, höchstens 12.</li>';
  if(g === 'bus') r += '<li>Runde 1: Jeder bekommt vier Karten über vier Fragen: Rot oder Schwarz, höher oder tiefer, zwischen, daneben oder trifft, welches Symbol. Jede Frage bringt oder kostet einen Schluck.</li><li>Runde 2: Zehn Karten liegen als Pyramide. Nur hier gibt es mehr als einen Schluck. Wer beim Aufdecken den gleichen Wert hat, legt ab. Reihe 1: 1 Schluck trinken, Reihe 2: 2 Schlücke verteilen, Reihe 3: 3 Schlücke trinken, Reihe 4: 4 Schlücke verteilen, jeweils pro Karte.</li><li>Runde 3: Wer die meisten Karten übrig hat, fährt Bus. Er muss alle vier Fragen hintereinander schaffen, mit den restlichen Karten des Decks. Jeder Fehler kostet einen Schluck, dann geht es von vorne los. Nach 10 Schlücken im Bus ist der Busfahrer erlöst, ebenso wenn das Deck durch ist. Während der Busfahrt kann niemand Runden schmeißen.</li><li>Frage 3: Zwischen, daneben oder trifft. „Trifft“ heißt, die Karte hat genau den Wert von Karte 1 oder 2.</li><li>Bei Höher oder tiefer zählt ein gleicher Wert als falsch. Ass ist hoch. Unmögliche Antworten (höher als ein Ass, tiefer als eine 2, zwischen zwei Nachbarwerten) sind gesperrt.</li><li>Haben mehrere gleich viele Karten übrig, wird gestochen: Jeder sagt Rot oder Schwarz. Liegt genau einer falsch, fährt er. Liegen mehrere falsch, stechen nur die weiter.</li>';
  r += isKasse()
    ? '<li>Bierkasse: Gewinne gehen aufs Konto. Verluste zahlt das Konto bis auf einen Schluck. Ist das Konto voll, wird der Überschuss verteilt.</li>'
    : '<li>Gewinne werden an die anderen verteilt. Der Gewinner bestimmt, wer wie viel bekommt.</li>';
  return r + '<li>6 Schlücke sind ein Bier.</li></ul>';
}
function switchHTML(){
  if(isCasino()) return '';
  const ok = canSwitch();
  return '<h2>Spiel wechseln</h2><div class="modes two" style="margin-bottom:8px">' + GAME_ORDER.filter(g => g !== game()).map(g =>
    '<button class="mode" data-act="switchGame" data-v="' + g + '" ' + (ok ? '' : 'disabled') + '><b>' + GAMES[g].name + '</b><span>' + GAMES[g].short + '</span></button>').join('') + '</div>' +
    (ok ? '<p class="hint" style="margin:0 0 16px">Spieler, Biere und Konten bleiben erhalten.</p>' : '<p class="hint" style="margin:0 0 16px">Erst die laufende Runde beenden.</p>');
}

app.addEventListener('click', e => {
  if(ui.suppressUntil && Date.now() < ui.suppressUntil) return;

  if(!btn) return;
  if(btn.classList.contains('scrim') && e.target.closest('[data-stop]')) return;
  handle(btn.dataset.act, btn, e);
});

function handle(a, btn, e){
  const pi = btn && btn.dataset.p !== undefined ? +btn.dataset.p : null;
  const p = (S && pi !== null) ? S.players[pi] : null;
  if(a !== 'rm' && a !== 'newgame' && a !== 'newbeer') ui.armed = null;
  switch(a){
    case 'addName': setup.names.push('Spieler ' + (setup.names.length + 1)); render(); break;
    case 'rmName': setup.names.splice(+btn.dataset.i, 1); render(); break;
    case 'rule': {
      const k = btn.dataset.k, v = btn.dataset.v;
      setup[k] = v === 'true' ? true : v === 'false' ? false : isNaN(+v) ? v : +v;
      render(); break;
    }
    case 'start': startGame(); break;
    case 'bet': p.bet = Math.min(p.bal, p.bet + +btn.dataset.v); save(); render(); break;
    case 'sip': if(canAfford(p, +btn.dataset.v)){ p.bet = +btn.dataset.v; save(); render(); } break;
    case 'clear': p.bet = 0; save(); render(); break;
    case 'allin': p.bet = p.bal; save(); render(); break;
    case 'rebuy': p.bal += S.rules.start; save(); render(); break;
    case 'throw': if(game() === 'bus' && S.bus && (S.bus.phase === 'ride' || S.bus.phase === 'stech')) break;
      if(p.konto > 0 && S.players.length > 1 && !(S.dist && S.distIdx < S.dist.length)){ S.give = { from:pi, alloc:{} }; save(); render(); } break;
    case 'gsip': {
      const g = S.give, to = +btn.dataset.to, v = +btn.dataset.v;
      const used = Object.values(g.alloc).reduce((x, y) => x + y, 0);
      const c0 = g.alloc[to] || 0;
      if(v > 0 && used >= S.players[g.from].konto) break;
      if(v < 0 && c0 <= 0) break;
      g.alloc[to] = c0 + v; save(); render(); break;
    }
    case 'gCancel': S.give = null; save(); render(); break;
    case 'gDone': giveDone(); break;
    case 'rplace': rlPlace(btn.dataset.v); break;
    case 'rsel': rlState().sel = +btn.dataset.v; save(); render(); break;
    case 'rchip': rlState().chip = +btn.dataset.v; save(); render(); break;
    case 'rundo': rlUndo(); break;
    case 'rclear': rlClear(); break;
    case 'rspin': rlSpin(); break;
    case 'rnext': { const R = rlState(); if(distPending()) break; R.phase = 'bet'; for(const q of S.players){ q.gr = null; q.recv = []; q.rres = null; } save(); render(); break; }
    case 'hl': hlGuess(btn.dataset.v); break;
    case 'bus': { const B = busState(); if(B.phase === 'deal') busDeal(btn.dataset.v); else if(B.phase === 'stech') busStech(btn.dataset.v); else if(B.phase === 'ride') busRide(btn.dataset.v); break; }
    case 'busFlip': busFlip(); break;
    case 'busNew': busNew(); save(); render(); break;
    case 'switchGame': switchGame(btn.dataset.v); break;
    case 'newbeer':
      if(ui.armed === 'nb' + p.id){ ui.armed = null; newBeer(p); save(); } else ui.armed = 'nb' + p.id;
      render(); break;
    case 'rm':
      if(S.give || (S.dist && S.distIdx < S.dist.length)) break;
      if(ui.armed === 'rm' + p.id){
        S.gone = (S.gone || 0) + p.drunk; S.players.splice(pi, 1); ui.armed = null;
        if(S.hl && S.hl.turn > pi) S.hl.turn--;
        if(S.bus){ if(S.bus.turn === pi){ S.bus.cards = []; S.bus.done = null; } else if(S.bus.turn > pi) S.bus.turn--; }
        if(!S.players.length){ setup.names = ['Spieler 1']; wipe(); S = null; } else save();
      } else ui.armed = 'rm' + p.id;
      render(); break;
    case 'addPlayer': {
      const inp = document.getElementById('newName');
      const name = (inp && inp.value.trim()) || ('Spieler ' + (S.players.length + 1));
      S.players.push(newPlayer(S.nextId++, name));
      save(); render();
      const strip = app.querySelector('.seats'); if(strip) strip.scrollLeft = strip.scrollWidth;
      break;
    }
    case 'deal': deal(); break;
    case 'ins': p.insWant = btn.dataset.v === '1'; save(); render(); break;
    case 'insDone': afterInsurance(); break;
    case 'hit': case 'stand': case 'double': case 'split': act(a); break;
    case 'dsip': case 'dshot': {
      const d = S.dist[S.distIdx], to = +btn.dataset.to, v = +btn.dataset.v;
      const key = a === 'dsip' ? 's' : 'sh';
      const [ls, lsh] = distLeft(d);
      const left = key === 's' ? ls : lsh;
      const c0 = d.alloc[to] || { s:0, sh:0 };
      if(v > 0 && left <= 0) break;
      if(v < 0 && c0[key] <= 0) break;
      c0[key] += v; d.alloc[to] = c0;
      save(); render(); break;
    }
    case 'distAuto': distRandom(); save(); render(); break;
    case 'distDone': distDone(); break;
    case 'next': nextRound(); break;
    case 'menu': ui.menu = true; ui.sheetIn = true; render(); break;
    case 'closeMenu': closeSheet(0); break;
    case 'install':
      if(installEvt){ installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(); }); }
      break;
    case 'newgame':
      if(ui.armed === 'newgame'){
        setup.names = S.players.map(x => x.name);
        setup.mode = S.rules.mode; setup.decks = S.rules.decks; setup.s17 = S.rules.s17; setup.peek = S.rules.peek;
        if(S.rules.mode === 'casino') setup.start = S.rules.start;
        wipe(); S = null; ui = { menu:false, armed:null, delay:{}, lastP:null }; seen = new Set();
      } else ui.armed = 'newgame';
      render(); break;
  }
}

if(S) for(const p of S.players){ if(p.konto === undefined) p.konto = 0; if(p.glass === undefined) p.glass = p.drunk % 6; if(p.side === undefined) p.side = 0; if(p.beerNo === undefined) p.beerNo = Math.floor(p.drunk / 6) + 1; }
if(S && S.rules.mode !== 'kasse'){ S.rules.mode = 'kasse'; S.rules.start = 6; for(const p of S.players){ if(p.bet > 6 || p.bet < 1) p.bet = 1; if(p.lastBet > 6) p.lastBet = 1; } }
if(S){
  for(const c of S.dealer){ seen.add(String(c.id)); seen.add('h' + c.id); }
